<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imersivo Lofi Train Study</title>
  <style>
    /* ============================================================
       VARIÁVEIS DE COR E ESTILOS GERAIS (Papercut 2D)
       ============================================================ */
    :root {
      /* Cabine de Dia */
      --cabine-wall-day: #e2dcd0;
      --cabine-frame-day: #7a583e;
      --banco-1-day: #6ca0b8; /* Mais claro (perto da janela) */
      --banco-2-day: #5b8fA7;
      --banco-3-day: #4c7e96;
      --banco-4-day: #3d6d85;
      --banco-5-day: #2d5b73; /* Mais escuro (dentro da cabine) */
      --mesa-1-day: #a9805a;
      --mesa-2-day: #99714c;
      --mesa-3-day: #89623e;
      --mesa-4-day: #795331;
      --mesa-5-day: #694424;

      /* Cabine de Noite */
      --cabine-wall-night: #1a1b2a;
      --cabine-frame-night: #2e2329;
      --banco-1-night: #2f4354;
      --banco-2-night: #253644;
      --banco-3-night: #1c2a35;
      --banco-4-night: #152028;
      --banco-5-night: #0e161c;
      --mesa-1-night: #443224;
      --mesa-2-night: #3a2a1d;
      --mesa-3-night: #2f2217;
      --mesa-4-night: #251a11;
      --mesa-5-night: #1b120b;

      /* Atuais */
      --cabine-wall: var(--cabine-wall-day);
      --cabine-frame: var(--cabine-frame-day);
      --banco-1: var(--banco-1-day);
      --banco-2: var(--banco-2-day);
      --banco-3: var(--banco-3-day);
      --banco-4: var(--banco-4-day);
      --banco-5: var(--banco-5-day);
      --mesa-1: var(--mesa-1-day);
      --mesa-2: var(--mesa-2-day);
      --mesa-3: var(--mesa-3-day);
      --mesa-4: var(--mesa-4-day);
      --mesa-5: var(--mesa-5-day);

      /* Céus */
      --sky-day-floresta: linear-gradient(180deg, #87ceeb 0%, #d4eefc 100%);
      --sky-night: linear-gradient(180deg, #090a14 0%, #171b34 100%);
      --sky-deserto-day: linear-gradient(180deg, #ff9e54 0%, #ffd084 100%);
      --sky-deserto-night: linear-gradient(180deg, #1b0a1a 0%, #3e1b2f 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #111217;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      color: #f0f0f0;
      padding: 12px;
    }

    /* MOLDURA PRINCIPAL DO VAGÃO */
    .train-stage {
      position: relative;
      width: 900px;
      max-width: 96vw;
      height: 600px;
      background: var(--cabine-wall);
      border: 14px solid var(--cabine-frame);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 40px rgba(0,0,0,0.3);
      transition: background 6s ease, border-color 6s ease;
    }

    /* JANELA QUADRADA ARREDONDADA */
    .train-window {
      position: absolute;
      top: 35px;
      left: 50%;
      transform: translateX(-50%);
      width: 580px;
      height: 380px;
      border-radius: 36px;
      border: 12px solid #553823;
      background: #87ceeb;
      overflow: hidden;
      box-shadow: inset 0 10px 25px rgba(0,0,0,0.4), 0 8px 16px rgba(0,0,0,0.3);
      z-index: 2;
    }

    .body-night .train-window {
      border-color: #241710;
    }

    /* REFLEXO DE VIDRO (MANCHA BRANCA DIAGONAL) */
    .glass-glare {
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, 
        rgba(255,255,255,0.32) 0%, 
        rgba(255,255,255,0.18) 22%, 
        rgba(255,255,255,0.02) 23%, 
        rgba(255,255,255,0.0) 45%, 
        rgba(255,255,255,0.15) 55%, 
        rgba(255,255,255,0.0) 58%
      );
      pointer-events: none;
      z-index: 20;
    }

    /* CÉU E ASTROS */
    .sky-canvas {
      position: absolute;
      inset: 0;
      background: var(--sky-day-floresta);
      transition: background 6s ease;
      z-index: 1;
    }

    .stars-layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 6s ease;
      z-index: 2;
      background-image: 
        radial-gradient(2px 2px at 40px 60px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 140px 120px, #fff8db, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 280px 40px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 390px 90px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 490px 50px, #fff5cc, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 200px 160px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 330px 150px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      animation: twinkle 3s infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    /* SOL E LUA */
    .celestial-orbit {
      position: absolute;
      width: 72px;
      height: 72px;
      left: 70px;
      top: 50px;
      z-index: 3;
      cursor: pointer;
      transition: transform 6s cubic-bezier(0.4, 0, 0.2, 1), opacity 6s ease;
    }

    .sun-body {
      width: 100%;
      height: 100%;
      background: #ffdb4d;
      border-radius: 50%;
      box-shadow: 0 0 35px #ffa834, 0 0 10px #fff;
      transition: all 6s ease;
    }

    .moon-body {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow: -15px 6px 0 0 #f4f6ce;
      opacity: 0;
      transform: scale(0.9);
      transition: all 6s ease;
      filter: drop-shadow(0 0 16px rgba(244, 246, 206, 0.8));
    }

    /* ESTADO NOITE PARA ASTROS */
    .is-night .sun-body {
      opacity: 0;
      transform: translateY(120px) scale(0.6);
    }
    .is-night .moon-body {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .is-night .stars-layer {
      opacity: 1;
    }

    /* ============================================================
       CAMADAS DE PAISAGEM (PARALLAX PAPERCUT)
       ============================================================ */
    .layer-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      overflow: hidden;
    }

    /* Camadas 1, 2, 3: Colinas em Movimento Contínuo */
    .hills-row {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 200%;
      height: 100%;
      display: flex;
    }

    .layer-1 {
      z-index: 5;
      animation: parallaxMove 38s linear infinite;
    }
    .layer-2 {
      z-index: 6;
      animation: parallaxMove 24s linear infinite;
    }
    .layer-3 {
      z-index: 7;
      animation: parallaxMove 14s linear infinite;
    }

    @keyframes parallaxMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .hill-svg {
      width: 100%;
      height: 100%;
      display: block;
      transition: fill 6s ease;
    }

    /* Camada 4 (7s) e 5 (4s) - Árvores / Prédios / Cactos individuais */
    .layer-active-4, .layer-active-5 {
      position: absolute;
      bottom: 22px;
      right: -120px;
      z-index: 8;
    }
    .layer-active-5 {
      z-index: 9;
      bottom: 15px;
    }

    .anim-pass-4 {
      animation: passObject 7s linear infinite;
    }
    .anim-pass-5 {
      animation: passObject 4s linear infinite;
    }

    @keyframes passObject {
      0% { transform: translateX(0); }
      100% { transform: translateX(-720px); }
    }

    /* Camada 6 (Postes de Luz a cada 2s) */
    .layer-poles {
      position: absolute;
      bottom: 0;
      right: -80px;
      width: 32px;
      height: 250px;
      z-index: 10;
      animation: passObject 2s linear infinite;
    }

    .pole-stem {
      position: absolute;
      bottom: 0;
      left: 14px;
      width: 6px;
      height: 220px;
      background: #3a3b40;
    }
    .pole-lamp {
      position: absolute;
      top: 30px;
      left: 4px;
      width: 26px;
      height: 14px;
      background: #8b929a;
      border-radius: 8px 8px 3px 3px;
      transition: background 6s, box-shadow 6s;
    }
    .pole-glow {
      position: absolute;
      top: 40px;
      left: 2px;
      width: 30px;
      height: 30px;
      background: radial-gradient(circle, rgba(255,230,120,0.85) 0%, rgba(255,230,120,0) 70%);
      opacity: 0;
      border-radius: 50%;
      transition: opacity 6s;
    }
    .is-night .pole-lamp {
      background: #ffe366;
      box-shadow: 0 0 16px #ffcc00;
    }
    .is-night .pole-glow {
      opacity: 1;
    }

    /* ESPECIFICIDADES DOS CENÁRIOS */
    /* Cidade: Prédios e Carros */
    .city-block {
      display: flex;
      align-items: flex-end;
      gap: 14px;
    }
    .building {
      width: 48px;
      background: #485265;
      border-radius: 4px 4px 0 0;
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
      padding: 6px 5px;
      transition: background 6s;
    }
    .b-window {
      width: 9px;
      height: 12px;
      background: #8993a4;
      border-radius: 2px;
      transition: background 6s;
    }
    .is-night .building {
      background: #1e2430;
    }
    .is-night .b-window.lit {
      background: #ffe677;
      box-shadow: 0 0 6px #ffd54f;
    }

    .city-cars-track {
      position: absolute;
      bottom: 2px;
      left: 0;
      width: 100%;
      height: 20px;
      z-index: 11;
      display: none;
    }
    .car {
      position: absolute;
      bottom: 2px;
      height: 12px;
      background: #d84343;
      border-radius: 4px 4px 1px 1px;
    }
    .car-1 { width: 34px; animation: carDrive 4.5s linear infinite; }
    .car-2 { width: 44px; background: #3e72b4; animation: carDrive 6.5s linear infinite 2s; }
    @keyframes carDrive {
      0% { right: -60px; }
      100% { right: 650px; }
    }

    /* Oceano: Grades e Ondas Brancas Piscando */
    .ocean-waves-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 130px;
      z-index: 6;
      display: none;
      overflow: hidden;
      background: #1b739e;
      transition: background 6s;
    }
    .is-night .ocean-waves-container {
      background: #092e42;
    }
    .wave-line {
      position: absolute;
      height: 3px;
      background: rgba(255,255,255,0.9);
      border-radius: 3px;
      animation: waveBlink 2.2s infinite ease-in-out;
    }
    @keyframes waveBlink {
      0%, 100% { opacity: 0.15; transform: scaleX(0.8); }
      50% { opacity: 0.95; transform: scaleX(1.1); }
    }
    .ocean-railing {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 34px;
      border-top: 3px solid #6b7c85;
      background: repeating-linear-gradient(90deg, transparent, transparent 18px, #6b7c85 18px, #6b7c85 22px);
      z-index: 12;
      display: none;
    }

    /* Deserto: Cactos */
    .cactus-svg {
      fill: #2d6b46;
      transition: fill 6s;
    }
    .is-night .cactus-svg {
      fill: #143522;
    }

    /* CLIMA (Canvas para Chuva e Neve) */
    #weatherCanvas {
      position: absolute;
      inset: 0;
      z-index: 15;
      pointer-events: none;
    }
    .weather-darken {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      z-index: 14;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }
    .weather-snow-tint {
      position: absolute;
      inset: 0;
      background: rgba(240, 248, 255, 0.28);
      z-index: 14;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }

    /* ============================================================
       INTERIOR DO VAGÃO (BANCOS, MESA, OBJETOS)
       ============================================================ */
    .wagon-interior {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 25;
    }

    /* BANCOS ERGONÔMICOS (L invertido com 5 tons de cor) */
    .seat {
      position: absolute;
      bottom: -15px;
      width: 125px;
      height: 290px;
      pointer-events: auto;
    }
    .seat-left {
      left: 30px;
    }
    .seat-right {
      right: 30px;
      transform: scaleX(-1); /* Simetria ergonômica */
    }

    /* 5 faixas de cores do banco (#1 mais claro virado para janela) */
    .seat-body {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 42px 24px 0 0;
      overflow: hidden;
      display: flex;
      box-shadow: 0 10px 24px rgba(0,0,0,0.5);
    }
    .seat-stripe {
      height: 100%;
      flex: 1;
      transition: background 6s ease;
    }
    /* Costura vertical no meio para dar profundidade sem 3D */
    .seat-seam {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 80%;
      background: rgba(255,255,255,0.22);
      border-radius: 2px;
    }
    /* Encosto de cabeça ligeiramente arredondado e mais largo */
    .seat-headrest {
      position: absolute;
      top: 0;
      left: -6px;
      width: 137px;
      height: 75px;
      border-radius: 35px 35px 20px 20px;
      background: inherit;
      overflow: hidden;
      display: flex;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    }

    /* MESA CENTRALIZADA (Regra das 5 cores em degradê de faixas) */
    .table-container {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 165px;
      pointer-events: auto;
    }
    .table-top {
      width: 100%;
      height: 38px;
      border-radius: 12px 12px 4px 4px;
      display: flex;
      overflow: hidden;
      box-shadow: 0 10px 18px rgba(0,0,0,0.4);
    }
    .table-stripe {
      height: 100%;
      flex: 1;
      transition: background 6s ease;
    }
    .table-pedestal {
      width: 80px;
      height: 127px;
      margin: 0 auto;
      display: flex;
      overflow: hidden;
    }

    /* ============================================================
       OBJETOS EM CIMA DA MESA
       ============================================================ */
    .table-items {
      position: absolute;
      top: -48px;
      left: 0;
      width: 100%;
      height: 48px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 20px;
    }

    /* 1. RELÓGIO ANALÓGICO (Precisão matemática + 3 tons) */
    .clock-wrapper {
      position: relative;
      width: 58px;
      height: 58px;
      margin-bottom: 6px;
    }
    /* Moldura circular perfeita de 3 tons */
    .clock-frame-tone-1 {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #70757d;
      padding: 3px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.35);
      transition: background 6s;
    }
    .clock-frame-tone-2 {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #4b5056;
      padding: 3px;
      transition: background 6s;
    }
    .clock-frame-tone-3 {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #2f3237;
      position: relative;
      transition: background 6s;
    }
    /* Mostrador branco recuado */
    .clock-dial {
      position: absolute;
      inset: 2px;
      background: #ffffff;
      border-radius: 50%;
    }
    /* 12 Marcadores colados à borda interna */
    .clock-ticks {
      position: absolute;
      inset: 0;
    }
    .tick {
      position: absolute;
      left: 50%;
      top: 1px;
      width: 1.5px;
      height: 3.5px;
      background: #222;
      transform-origin: 50% 21px; /* raio exato */
      margin-left: -0.75px;
    }
    /* Ponteiros (Comprimento estritamente menor que o raio) */
    .needle {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: 50% 100%;
      border-radius: 2px;
    }
    .needle-hour {
      width: 2.2px;
      height: 11px;
      background: #202020;
      margin-left: -1.1px;
    }
    .needle-minute {
      width: 1.6px;
      height: 15px;
      background: #3b3b3b;
      margin-left: -0.8px;
    }
    .needle-second {
      width: 1px;
      height: 17px;
      background: #d32f2f;
      margin-left: -0.5px;
    }
    .clock-center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 3.5px;
      height: 3.5px;
      background: #202020;
      border-radius: 50%;
      z-index: 5;
    }

    /* 2. XÍCARA DE CAFÉ TRANSPARENTE (ÚNICA INTERATIVA) */
    .coffee-interactive {
      position: relative;
      width: 34px;
      height: 38px;
      margin-bottom: 4px;
      cursor: pointer;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }
    /* Corpo translúcido */
    .cup-glass {
      position: absolute;
      bottom: 0;
      left: 2px;
      width: 24px;
      height: 32px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px 2px 8px 8px;
      overflow: hidden;
      backdrop-filter: blur(1px);
    }
    /* Líquido (Café marrom com scaleY decrescente) */
    .cup-liquid {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 24px;
      background: #5c341b;
      transform-origin: bottom center;
      transition: transform 0.25s linear;
      border-top: 1px solid #7c4826;
    }
    /* Alça no terço central fundida ao corpo */
    .cup-handle {
      position: absolute;
      right: 1px;
      top: 10px;
      width: 10px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-left: none;
      border-radius: 0 8px 8px 0;
    }

    /* 3. LIVROS DEITADOS (3 Retângulos sobrepostos) */
    .books-stack {
      position: relative;
      width: 58px;
      height: 24px;
      margin-bottom: 2px;
    }
    /* Livro de Baixo */
    .book-layer-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 56px;
      height: 8px;
      background: #2b4c7e; /* 3 tons: capa 1 */
      border-radius: 2px;
    }
    .book-layer-pages {
      position: absolute;
      bottom: 2px;
      left: 4px;
      width: 50px;
      height: 5px;
      background: #fbf9e8; /* páginas */
      border-radius: 1px;
    }
    .book-layer-top {
      position: absolute;
      bottom: 6px;
      left: 1px;
      width: 53px;
      height: 2.5px;
      background: #1e3557; /* capa 3 */
      border-radius: 2px;
    }
    /* Livro de Cima (levemente deslocado) */
    .book-upper {
      position: absolute;
      bottom: 9px;
      left: 4px;
      width: 48px;
      height: 9px;
    }
    .book-upper-back {
      position: absolute;
      bottom: 0;
      width: 48px;
      height: 7px;
      background: #8b3a3a;
      border-radius: 2px;
    }
    .book-upper-pages {
      position: absolute;
      bottom: 1.5px;
      left: 3px;
      width: 43px;
      height: 4px;
      background: #fdfcee;
    }
    .book-upper-cover {
      position: absolute;
      bottom: 5px;
      left: 1px;
      width: 46px;
      height: 2px;
      background: #632626;
    }

    /* CARTÃO DE RECADOS AO LADO DA JANELA */
    .note-guide {
      position: absolute;
      right: 28px;
      top: 50px;
      width: 110px;
      background: #fffbe6;
      color: #3f3627;
      padding: 10px 9px;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      border-left: 4px solid #d4a343;
      font-size: 11px;
      line-height: 1.35;
      z-index: 26;
      pointer-events: auto;
      transition: background 6s, color 6s;
    }
    .body-night .note-guide {
      background: #2b2820;
      color: #e5d8b8;
      border-left-color: #8c6a28;
    }

    /* PAINEL DE CONTROLE EXTERNO */
    .ui-controls {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      z-index: 30;
      max-width: 900px;
    }
    .btn-group {
      display: flex;
      background: #1e2029;
      border-radius: 12px;
      padding: 4px;
      border: 1px solid #323544;
      gap: 4px;
    }
    .btn {
      background: transparent;
      color: #b8bed1;
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #2a2e3d;
      color: #fff;

</head>
<body>

  <!-- PALCO DO VAGÃO (Imersivo Lofi Train Study) -->
  <div class="train-stage" id="trainStage">
    
    <!-- JANELA DO TREM (Estilo Moldura Papercut 2D) -->
    <div class="train-window" id="trainWindow">
      
      <!-- Reflexo e Refração de Vidro -->
      <div class="glass-glare"></div>

      <!-- Canvas de Chuva e Neve -->
      <canvas id="weatherCanvas"></canvas>

      <!-- Céu & Estrelas Cintilantes -->
      <div class="sky-canvas" id="skyCanvas"></div>

        <div class="sun-body" id="sunBody"></div>
        <div class="moon-body" id="moonBody"></div>
      </div>

      <!-- CAMADAS DE PAISAGEM (Parallax) -->
      <div class="layer-container" id="layerContainer">
        
        <!-- Camada 1: Colinas Distantes (Não tampa sol/lua) -->
        <div class="hills-row layer-1" id="layer1Hills">
          <svg class="hill-svg" viewBox="0 0 1200 400" preserveAspectRatio="none">
            <path id="pathHill1" d="M0,230 Q280,140 600,220 T1200,200 L1200,400 L0,400 Z" fill="#629b82"/>
          </svg>
          <svg class="hill-svg" viewBox="0 0 1200 400" preserveAspectRatio="none">

        <!-- Camada 2: Colinas Médias (Mais claras que a 1) -->
        <div class="hills-row layer-2" id="layer2Hills">

            <path id="pathHill2" d="M0,280 Q320,200 680,270 T1200,250 L1200,400 L0,400 Z" fill="#78b095"/>
          </svg>
          <svg class="hill-svg" viewBox="0 0 1200 400" preserveAspectRatio="none">

        <!-- Camada 3: Base Terrestre / Colina Próxima -->
        <div class="hills-row layer-3" id="layer3Hills">
          <svg class="hill-svg" viewBox="0 0 1200 400" preserveAspectRatio="none">
            <path id="pathHill3" d="M0,330 Q220,280 500,320 T1200,310 L1200,400 L0,400 Z" fill="#4d7f69"/>
          </svg>
          <svg class="hill-svg" viewBox="0 0 1200 400" preserveAspectRatio="none">
            <path id="pathHill3b" d="M0,310 Q220,280 500,320 T1200,310 L1200,400 L0,400 Z" fill="#4d7f69"/>
          </svg>
        </div>

        <!-- Camada Oceano: Mar, Ondas e Grade -->
        <div class="ocean-waves-container" id="oceanWavesContainer">
          <div class="wave-line" style="top: 25px; left: 40px; width: 55px; animation-delay: 0.1s;"></div>
          <div class="wave-line" style="top: 45px; left: 160px; width: 70px; animation-delay: 0.8s;"></div>
          <div class="wave-line" style="top: 30px; left: 320px; width: 45px; animation-delay: 1.4s;"></div>
          <div class="wave-line" style="top: 75px; left: 80px; width: 85px; animation-delay: 0.5s;"></div>
          <div class="wave-line" style="top: 60px; left: 250px; width: 60px; animation-delay: 1.9s;"></div>
          <div class="wave-line" style="top: 90px; left: 400px; width: 75px; animation-delay: 1.1s;"></div>
        </div>
        <div class="ocean-railing" id="oceanRailing"></div>

        <!-- Camada Cidade: Pista de Carrinhos na Base -->
        <div class="city-cars-track" id="cityCarsTrack">
          <div class="car car-1"></div>
          <div class="car car-2"></div>
        </div>

        <!-- Camada 4: Elementos Ativos Ciclo 7s (Árvores / Prédios / Cactos) -->
        <div class="layer-active-4 anim-pass-4" id="layerActive4"></div>

        <!-- Camada 5: Elementos Ativos Ciclo 4s (Árvores / Prédios / Cactos) -->
        <div class="layer-active-5 anim-pass-5" id="layerActive5"></div>

        <!-- Camada 6: Postes Rápidos Ciclo 2s (Desligado de dia, aceso de noite) -->
        <div class="layer-poles" id="layerPoles">
          <div class="pole-stem"></div>
          <div class="pole-lamp"></div>
          <div class="pole-glow"></div>
        </div>

      </div>
    </div>

    <!-- BILHETE GUIA NA PAREDE DO VAGÃO -->
    <div class="note-guide">
      📌 <strong>Dica Lofi:</strong><br>
      Ao clicar no sol ele se põe e nasce a lua. Clique na xícara para tomar seu café!
    </div>

    <!-- INTERIOR DO VAGÃO -->
    <div class="wagon-interior">

      <!-- BANCO ESQUERDO (5 tons, #1 mais claro voltado para a janela) -->
      <div class="seat seat-left">
        <div class="seat-headrest">
          <div class="seat-stripe" style="background: var(--banco-5);"></div>
          <div class="seat-stripe" style="background: var(--banco-4);"></div>
          <div class="seat-stripe" style="background: var(--banco-3);"></div>
          <div class="seat-stripe" style="background: var(--banco-2);"></div>
          <div class="seat-stripe" style="background: var(--banco-1);"></div>
        </div>
        <div class="seat-body">
          <div class="seat-stripe" style="background: var(--banco-5);"></div>
          <div class="seat-stripe" style="background: var(--banco-4);"></div>
          <div class="seat-stripe" style="background: var(--banco-3);"></div>
          <div class="seat-stripe" style="background: var(--banco-2);"></div>
          <div class="seat-stripe" style="background: var(--banco-1);"></div>
          <div class="seat-seam"></div>
        </div>
      </div>

      <!-- BANCO DIREITO (Simétrico, 5 tons, #1 virado para a janela) -->
      <div class="seat seat-right">
        <div class="seat-headrest">
          <div class="seat-stripe" style="background: var(--banco-5);"></div>
          <div class="seat-stripe" style="background: var(--banco-4);"></div>
          <div class="seat-stripe" style="background: var(--banco-3);"></div>
          <div class="seat-stripe" style="background: var(--banco-2);"></div>
          <div class="seat-stripe" style="background: var(--banco-1);"></div>
        </div>
        <div class="seat-body">
          <div class="seat-stripe" style="background: var(--banco-5);"></div>
          <div class="seat-stripe" style="background: var(--banco-4);"></div>
          <div class="seat-stripe" style="background: var(--banco-3);"></div>
          <div class="seat-stripe" style="background: var(--banco-2);"></div>
          <div class="seat-stripe" style="background: var(--banco-1);"></div>
          <div class="seat-seam"></div>
        </div>
      </div>

      <!-- MESA CENTRAL (5 faixas tonais) -->
      <div class="table-container">
        
        <!-- Itens em cima da mesa -->
        <div class="table-items">

          <!-- 1. RELÓGIO ANALÓGICO (Hora real, 3 tons, 12 marcadores matemáticos) -->
          <div class="clock-wrapper" title="Relógio Analógico em tempo real">
            <div class="clock-frame-tone-1">
              <div class="clock-frame-tone-2">
                <div class="clock-frame-tone-3">
                  <div class="clock-dial">
                    <!-- 12 Marcadores colados -->
                    <div class="clock-ticks" id="clockTicks"></div>
                    <!-- Ponteiros ancorados exatamente no centro -->
                    <div class="needle needle-hour" id="needleHour"></div>
                    <div class="needle needle-minute" id="needleMinute"></div>
                    <div class="needle needle-second" id="needleSecond"></div>
                    <div class="clock-center-dot"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 2. XÍCARA TRANSPARENTE (Único objeto com interação direta) -->
          <div class="coffee-interactive" id="coffeeCup" title="Clique para beber um gole de café!">
            <div class="cup-glass">
              <div class="cup-liquid" id="cupLiquid"></div>
            </div>
            <div class="cup-handle"></div>
          </div>

          <!-- 3. LIVROS DEITADOS (3 camadas sobrepostas) -->
          <div class="books-stack" title="Livros de Estudo Lofi">
            <!-- Livro 1 -->
            <div class="book-layer-bottom"></div>
            <div class="book-layer-pages"></div>
            <div class="book-layer-top"></div>
            <!-- Livro 2 em cima -->
            <div class="book-upper">
              <div class="book-upper-back"></div>
              <div class="book-upper-pages"></div>
              <div class="book-upper-cover"></div>
            </div>
          </div>

        </div>

        <!-- Tampo da mesa (5 faixas horizontais de luz e sombra) -->
        <div class="table-top">
          <div class="table-stripe" style="background: var(--mesa-1);"></div>
          <div class="table-stripe" style="background: var(--mesa-2);"></div>
          <div class="table-stripe" style="background: var(--mesa-3);"></div>
          <div class="table-stripe" style="background: var(--mesa-4);"></div>
          <div class="table-stripe" style="background: var(--mesa-5);"></div>
        </div>
        <!-- Suporte da mesa -->
        <div class="table-pedestal">
          <div class="table-stripe" style="background: var(--mesa-1);"></div>
          <div class="table-stripe" style="background: var(--mesa-2);"></div>
          <div class="table-stripe" style="background: var(--mesa-3);"></div>
          <div class="table-stripe" style="background: var(--mesa-4);"></div>
          <div class="table-stripe" style="background: var(--mesa-5);"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- PAINEL DE CONTROLES (CENÁRIOS, CLIMA E ÁUDIO) -->
  <div class="ui-controls">
    <!-- Cenários -->
    <div class="btn-group">
      <button class="btn active" id="btnSceneryFloresta">🌲 Floresta</button>
      <button class="btn" id="btnSceneryCidade">🏙️ Cidade</button>
      <button class="btn" id="btnSceneryOceano">🌊 Oceano</button>
      <button class="btn" id="btnSceneryDeserto">🏜️ Deserto</button>
    </div>

    <!-- Clima -->
    <div class="btn-group">
      <button class="btn" id="btnWeatherChuva">🌧️ Chuva</button>
      <button class="btn" id="btnWeatherNeve">❄️ Neve</button>
      <button class="btn active" id="btnWeatherLimpo">☀️ Limpo</button>
    </div>

    <!-- Áudio & Imersão Lofi -->
    <button class="btn btn-audio" id="btnAudioToggle">
      <span id="audioIcon">🎵</span> Áudio Lofi & Trem
    </button>
  </div>

  <!-- ============================================================
       SCRIPTS JAVASCRIPT
       ============================================================ -->
  <script>
    /* ============================================================
       1. RELÓGIO ANALÓGICO COM HORÁRIO REAL E 12 MARCADORES
       ============================================================ */
    const clockTicks = document.getElementById('clockTicks');
    for (let i = 0; i < 12; i++) {
      const tick = document.createElement('div');
      tick.className = 'tick';
      tick.style.transform = `rotate(${i * 30}deg)`;
      clockTicks.appendChild(tick);
    }

    const needleHour = document.getElementById('needleHour');
    const needleMinute = document.getElementById('needleMinute');
    const needleSecond = document.getElementById('needleSecond');

    function updateRealTimeClock() {
      const now = new Date();
      const s = now.getSeconds();
      const m = now.getMinutes() + s / 60;
      const h = (now.getHours() % 12) + m / 60;

      needleSecond.style.transform = `rotate(${s * 6}deg)`;
      needleMinute.style.transform = `rotate(${m * 6}deg)`;
      needleHour.style.transform = `rotate(${h * 30}deg)`;
    }
    setInterval(updateRealTimeClock, 1000);
    updateRealTimeClock();

    /* ============================================================
       2. XÍCARA DE CAFÉ INTERATIVA (Esvaziamento gradual em Loop)
       ============================================================ */
    const coffeeCup = document.getElementById('coffeeCup');
    const cupLiquid = document.getElementById('cupLiquid');
    let coffeeLevel = 1.0;
    let isDrinking = false;

    coffeeCup.addEventListener('click', () => {
      if (isDrinking) return;
      isDrinking = true;

      // Reproduz som de beber via Web Audio API se o áudio estiver ativo
      playCoffeeSipSound();

      const sipInterval = setInterval(() => {
        coffeeLevel -= 0.2;
        if (coffeeLevel <= 0.05) {
          cupLiquid.style.transform = `scaleY(0)`;
          clearInterval(sipInterval);
          // Reset instantâneo após esvaziar
          setTimeout(() => {
            coffeeLevel = 1.0;
            cupLiquid.style.transform = `scaleY(1)`;
            isDrinking = false;
          }, 900);
        } else {
          cupLiquid.style.transform = `scaleY(${coffeeLevel})`;
        }
      }, 160);
    });

    /* ============================================================
       3. TRANSIÇÃO DIA <-> NOITE (6 SEGUNDOS)
       ============================================================ */
    const trainStage = document.getElementById('trainStage');
    const celestialOrbit = document.getElementById('celestialOrbit');
    let isNightMode = false;

    celestialOrbit.addEventListener('click', toggleDayNightCycle);

    function toggleDayNightCycle() {
      isNightMode = !isNightMode;
      trainStage.classList.toggle('is-night', isNightMode);
      document.body.classList.toggle('body-night', isNightMode);

      // Atualiza variáveis CSS da Cabine (Regra de luz e escuridão de 5 cores)
      const root = document.documentElement;
      if (isNightMode) {
        root.style.setProperty('--cabine-wall', 'var(--cabine-wall-night)');
        root.style.setProperty('--cabine-frame', 'var(--cabine-frame-night)');
        root.style.setProperty('--banco-1', 'var(--banco-1-night)');
        root.style.setProperty('--banco-2', 'var(--banco-2-night)');
        root.style.setProperty('--banco-3', 'var(--banco-3-night)');
        root.style.setProperty('--banco-4', 'var(--banco-4-night)');
        root.style.setProperty('--banco-5', 'var(--banco-5-night)');
        root.style.setProperty('--mesa-1', 'var(--mesa-1-night)');
        root.style.setProperty('--mesa-2', 'var(--mesa-2-night)');
        root.style.setProperty('--mesa-3', 'var(--mesa-3-night)');
        root.style.setProperty('--mesa-4', 'var(--mesa-4-night)');
        root.style.setProperty('--mesa-5', 'var(--mesa-5-night)');
      } else {
        root.style.setProperty('--cabine-wall', 'var(--cabine-wall-day)');
        root.style.setProperty('--cabine-frame', 'var(--cabine-frame-day)');
        root.style.setProperty('--banco-1', 'var(--banco-1-day)');
        root.style.setProperty('--banco-2', 'var(--banco-2-day)');
        root.style.setProperty('--banco-3', 'var(--banco-3-day)');
        root.style.setProperty('--banco-4', 'var(--banco-4-day)');
        root.style.setProperty('--banco-5', 'var(--banco-5-day)');
        root.style.setProperty('--mesa-1', 'var(--mesa-1-day)');
        root.style.setProperty('--mesa-2', 'var(--mesa-2-day)');
        root.style.setProperty('--mesa-3', 'var(--mesa-3-day)');
        root.style.setProperty('--mesa-4', 'var(--mesa-4-day)');
        root.style.setProperty('--mesa-5', 'var(--mesa-5-day)');
      }
      applySceneryPalette(currentScenery);
    }

    /* ============================================================
       4. CENÁRIOS ESPECÍFICOS (Floresta, Cidade, Oceano, Deserto)
       ============================================================ */
    const skyCanvas = document.getElementById('skyCanvas');
    const pathHill1 = document.getElementById('pathHill1');
    const pathHill1b = document.getElementById('pathHill1b');
    const pathHill2 = document.getElementById('pathHill2');
    const pathHill2b = document.getElementById('pathHill2b');
    const pathHill3 = document.getElementById('pathHill3');
    const pathHill3b = document.getElementById('pathHill3b');

    const layerActive4 = document.getElementById('layerActive4');
    const layerActive5 = document.getElementById('layerActive5');
    const layerPoles = document.getElementById('layerPoles');
    const oceanWaves = document.getElementById('oceanWavesContainer');
    const oceanRailing = document.getElementById('oceanRailing');
    const cityCars = document.getElementById('cityCarsTrack');

    let currentScenery = 'floresta';

    // Modelos SVG Papercut
    const svgTreeBig = `
      <svg width="45" height="75" viewBox="0 0 45 75">
        <rect x="20" y="52" width="6" height="23" fill="#4a3728"/>
        <polygon points="22.5,5 5,30 40,30" fill="#2d6a4f"/>
        <polygon points="22.5,20 2,46 43,46" fill="#1b4332"/>
      </svg>
    `;
    const svgTreeSmall = `
      <svg width="34" height="55" viewBox="0 0 34 55">
        <rect x="15" y="38" width="4" height="17" fill="#4a3728"/>
        <polygon points="17,3 4,24 30,24" fill="#40916c"/>
        <polygon points="17,16 2,38 32,38" fill="#2d6a4f"/>
      </svg>
    `;

    const svgCactusBig = `
      <svg class="cactus-svg" width="40" height="70" viewBox="0 0 40 70">
        <rect x="16" y="5" width="8" height="65" rx="4"/>
        <path d="M6,25 L16,25 L16,33 L6,33 L6,15 L12,15 L12,20 L8,20" fill="currentColor"/>
        <path d="M24,32 L34,32 L34,40 L24,40 L24,20 L30,20 L30,26 L26,26" fill="currentColor"/>
      </svg>
    `;
    const svgCactusSmall = `
      <svg class="cactus-svg" width="28" height="48" viewBox="0 0 28 48">
        <rect x="11" y="3" width="6" height="45" rx="3"/>
        <path d="M4,18 L11,18 L11,24 L4,24 L4,10 L8,10 L8,14 L6,14" fill="currentColor"/>
      </svg>
    `;

    function getCityBlockHTML(isSmall) {
      const h1 = isSmall ? 55 : 85;
      const h2 = isSmall ? 70 : 105;
      const h3 = isSmall ? 45 : 75;
      return `
        <div class="city-block">
          <div class="building" style="height:${h1}px">
            <div class="b-window lit"></div><div class="b-window"></div>
            <div class="b-window"></div><div class="b-window lit"></div>
            <div class="b-window lit"></div><div class="b-window"></div>
          </div>
          <div class="building" style="height:${h2}px; width:56px;">
            <div class="b-window"></div><div class="b-window lit"></div>
            <div class="b-window lit"></div><div class="b-window lit"></div>
            <div class="b-window"></div><div class="b-window lit"></div>
          </div>
          <div class="building" style="height:${h3}px">
            <div class="b-window lit"></div><div class="b-window"></div>
            <div class="b-window"></div><div class="b-window"></div>
          </div>
        </div>
      `;
    }

    function applySceneryPalette(scenery) {
      currentScenery = scenery;
      
      // Reseta visibilidade de extras
      oceanWaves.style.display = 'none';
      oceanRailing.style.display = 'none';
      cityCars.style.display = 'none';
      layerPoles.style.display = 'block'; // Ativo por padrão

      if (scenery === 'floresta') {
        skyCanvas.style.background = isNightMode ? 'var(--sky-night)' : 'var(--sky-day-floresta)';
        pathHill1.setAttribute('fill', isNightMode ? '#152b21' : '#629b82');
        pathHill1b.setAttribute('fill', isNightMode ? '#152b21' : '#629b82');
        pathHill2.setAttribute('fill', isNightMode ? '#1b3b2c' : '#78b095');
        pathHill2b.setAttribute('fill', isNightMode ? '#1b3b2c' : '#78b095');
        pathHill3.setAttribute('fill', isNightMode ? '#0f2219' : '#4d7f69');
        pathHill3b.setAttribute('fill', isNightMode ? '#0f2219' : '#4d7f69');
        
        layerActive4.innerHTML = svgTreeBig;
        layerActive5.innerHTML = svgTreeSmall;
      } 
      else if (scenery === 'cidade') {
        skyCanvas.style.background = isNightMode ? 'linear-gradient(180deg, #0b0c16 0%, #1c1d33 100%)' : 'linear-gradient(180deg, #9bb8cf 0%, #d8e5ee 100%)';
        pathHill1.setAttribute('fill', isNightMode ? '#1e2430' : '#8091a0');
        pathHill1b.setAttribute('fill', isNightMode ? '#1e2430' : '#8091a0');
        pathHill2.setAttribute('fill', isNightMode ? '#283142' : '#95a7b8');
        pathHill2b.setAttribute('fill', isNightMode ? '#283142' : '#95a7b8');
        pathHill3.setAttribute('fill', isNightMode ? '#161b24' : '#6a7a8a');
        pathHill3b.setAttribute('fill', isNightMode ? '#161b24' : '#6a7a8a');

        layerActive4.innerHTML = getCityBlockHTML(false);
        layerActive5.innerHTML = getCityBlockHTML(true);
        cityCars.style.display = 'block';
      }
      else if (scenery === 'oceano') {
        skyCanvas.style.background = isNightMode ? 'var(--sky-night)' : 'linear-gradient(180deg, #74b9ff 0%, #c4e0e5 100%)';
        // No oceano as colinas simulam o horizonte baixo
        pathHill1.setAttribute('fill', isNightMode ? '#072435' : '#1d6f9a');
        pathHill1b.setAttribute('fill', isNightMode ? '#072435' : '#1d6f9a');
        pathHill2.setAttribute('fill', isNightMode ? '#0a3249' : '#2281b3');
        pathHill2b.setAttribute('fill', isNightMode ? '#0a3249' : '#2281b3');
        pathHill3.setAttribute('fill', isNightMode ? '#051924' : '#17597b');
        pathHill3b.setAttribute('fill', isNightMode ? '#051924' : '#17597b');

        oceanWaves.style.display = 'block';
        oceanRailing.style.display = 'block';
        layerActive4.innerHTML = '';
        layerActive5.innerHTML = '';
      }
      else if (scenery === 'deserto') {
        skyCanvas.style.background = isNightMode ? 'var(--sky-deserto-night)' : 'var(--sky-deserto-day)';
        pathHill1.setAttribute('fill', isNightMode ? '#422416' : '#d98b48');
        pathHill1b.setAttribute('fill', isNightMode ? '#422416' : '#d98b48');
        pathHill2.setAttribute('fill', isNightMode ? '#542f1d' : '#eb9e58');
        pathHill2b.setAttribute('fill', isNightMode ? '#542f1d' : '#eb9e58');
        pathHill3.setAttribute('fill', isNightMode ? '#331a0e' : '#b87035');
        pathHill3b.setAttribute('fill', isNightMode ? '#331a0e' : '#b87035');

        layerActive4.innerHTML = svgCactusBig;
        layerActive5.innerHTML = svgCactusSmall;
        layerPoles.style.display = 'none'; // Regra: Sem postes no deserto
      }
    }

    // Botões de Cenário
    const btnSceneryFloresta = document.getElementById('btnSceneryFloresta');
    const btnSceneryCidade = document.getElementById('btnSceneryCidade');
    const btnSceneryOceano = document.getElementById('btnSceneryOceano');
    const btnSceneryDeserto = document.getElementById('btnSceneryDeserto');
    const sceneryBtns = [btnSceneryFloresta, btnSceneryCidade, btnSceneryOceano, btnSceneryDeserto];

    function setSceneryActive(btn, name) {
      sceneryBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applySceneryPalette(name);
    }

    btnSceneryFloresta.addEventListener('click', () => setSceneryActive(btnSceneryFloresta, 'floresta'));
    btnSceneryCidade.addEventListener('click', () => setSceneryActive(btnSceneryCidade, 'cidade'));
    btnSceneryOceano.addEventListener('click', () => setSceneryActive(btnSceneryOceano, 'oceano'));
    btnSceneryDeserto.addEventListener('click', () => setSceneryActive(btnSceneryDeserto, 'deserto'));

    // Inicia no cenário padrão Floresta
    applySceneryPalette('floresta');

    /* ============================================================
       5. SISTEMA DE CLIMA (CHUVA, NEVE, LIMPO)
       ============================================================ */
    const canvas = document.getElementById('weatherCanvas');
    const ctx = canvas.getContext('2d');
    const weatherDarken = document.getElementById('weatherDarken');
    const weatherSnowTint = document.getElementById('weatherSnowTint');

    let currentWeather = 'limpo';
    let particles = [];
    const MAX_PARTICLES = 75;

    function resizeWeatherCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeWeatherCanvas);
    resizeWeatherCanvas();

    class WeatherParticle {
      constructor(type) {
        this.reset(type);
      }
      reset(type) {
        this.type = type;
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -canvas.height;
        if (type === 'chuva') {
          this.length = 9 + Math.random() * 7;
          this.speedY = 12 + Math.random() * 6;
          this.speedX = -2;
        } else if (type === 'neve') {
          this.radius = 1.5 + Math.random() * 2.5;
          this.speedY = 1.2 + Math.random() * 1.8;
          this.speedX = Math.sin(Math.random() * 5) * 0.8 - 0.5;
        }
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        if (this.y > canvas.height) {
          this.reset(this.type);
          this.y = 0;
        }
      }
      draw() {
        if (this.type === 'chuva') {
          ctx.strokeStyle = 'rgba(210, 235, 255, 0.7)';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(this.x, this.y);
          ctx.lineTo(this.x + this.speedX, this.y + this.length);
          ctx.stroke();
        } else if (this.type === 'neve') {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function initWeather(type) {
      currentWeather = type;
      particles = [];
      if (type !== 'limpo') {
        for (let i = 0; i < MAX_PARTICLES; i++) {
          particles.push(new WeatherParticle(type));
        }
      }
    }

    function weatherLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (currentWeather !== 'limpo') {
        particles.forEach(p => {
          p.update();
          p.draw();
        });
      }
      requestAnimationFrame(weatherLoop);
    }
    weatherLoop();

    const btnWeatherChuva = document.getElementById('btnWeatherChuva');
    const btnWeatherNeve = document.getElementById('btnWeatherNeve');
    const btnWeatherLimpo = document.getElementById('btnWeatherLimpo');
    const weatherBtns = [btnWeatherChuva, btnWeatherNeve, btnWeatherLimpo];

    function setWeather(btn, type) {
      weatherBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      weatherDarken.style.opacity = type === 'chuva' ? '1' : '0';
      weatherSnowTint.style.opacity = type === 'neve' ? '1' : '0';

      initWeather(type);
      updateAudioWeather(type);
    }

    btnWeatherChuva.addEventListener('click', () => setWeather(btnWeatherChuva, 'chuva'));
    btnWeatherNeve.addEventListener('click', () => setWeather(btnWeatherNeve, 'neve'));
    btnWeatherLimpo.addEventListener('click', () => setWeather(btnWeatherLimpo, 'limpo'));

    /* ============================================================
       6. MOTOR DE ÁUDIO LOFI NATIVO (WEB AUDIO API - ZERO ARQUIVOS EXTERNOS)
       ============================================================ */
    let audioCtx = null;
    let isAudioPlaying = false;
    let rainGain = null;
    let lofiTimer = null;

    const btnAudioToggle = document.getElementById('btnAudioToggle');
    const audioIcon = document.getElementById('audioIcon');

    function initWebAudio() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      // Ruído de Chuva (Pink/White Filtered Noise)
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      const rainFilter = audioCtx.createBiquadFilter();
      rainFilter.type = 'lowpass';
      rainFilter.frequency.setValueAtTime(900, audioCtx.currentTime);

      rainGain = audioCtx.createGain();
      rainGain.gain.setValueAtTime(0, audioCtx.currentTime);

      whiteNoise.connect(rainFilter);
      rainFilter.connect(rainGain);
      rainGain.connect(audioCtx.destination);
      whiteNoise.start();

      // Batida rítmica dos trilhos de trem ("Ta-tum... ta-tum...")
      startTrainTrackRhythm();

      // Música Lofi Relaxante Sintetizada
      startLofiChordsLoop();
    }

    function startTrainTrackRhythm() {
      setInterval(() => {
        if (!isAudioPlaying || !audioCtx) return;
        playRailClick(0);
        playRailClick(120);
      }, 1300);
    }

    function playRailClick(delayMs) {
      setTimeout(() => {
        if (!isAudioPlaying || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(85, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.08);

        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.09);
      }, delayMs);
    }

    // Progressão Harmônica Lofi Jazz (Tons quentes de Rhodes)
    const lofiChords = [
      [261.63, 329.63, 392.00, 493.88], // Cmaj7
      [220.00, 261.63, 329.63, 392.00], // Am7
      [174.61, 220.00, 261.63, 329.63], // Fmaj7
      [196.00, 246.94, 293.66, 349.23]  // G7
    ];
    let chordIdx = 0;

    function startLofiChordsLoop() {
      function triggerNextChord() {
        if (isAudioPlaying && audioCtx) {
          const chord = lofiChords[chordIdx];
          chordIdx = (chordIdx + 1) % lofiChords.length;

          chord.forEach(freq => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(550, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 0.8);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3.8);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 4.0);
          });
        }
        lofiTimer = setTimeout(triggerNextChord, 4000);
      }
      triggerNextChord();
    }

    function updateAudioWeather(type) {
      if (!rainGain || !audioCtx) return;
      if (type === 'chuva' && isAudioPlaying) {
        rainGain.gain.setTargetAtTime(0.09, audioCtx.currentTime, 1);
      } else {
        rainGain.gain.setTargetAtTime(0, audioCtx.currentTime, 1);
      }
    }

    function playCoffeeSipSound() {
      if (!audioCtx || !isAudioPlaying) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(520, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    btnAudioToggle.addEventListener('click', () => {
      initWebAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      isAudioPlaying = !isAudioPlaying;
      btnAudioToggle.classList.toggle('active', isAudioPlaying);
      audioIcon.textContent = isAudioPlaying ? '🔊' : '🎵';
      updateAudioWeather(currentWeather);
    });
  </script>
</body>
</html>
